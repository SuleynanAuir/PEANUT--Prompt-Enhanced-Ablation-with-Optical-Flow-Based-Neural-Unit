name: Deploy PEANUT project page

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Fetch project page at the triggering commit
        env:
          PAGE_REPOSITORY: ${{ github.repository }}
          PAGE_COMMIT: ${{ github.sha }}
        run: |
          git init
          git remote add origin "https://github.com/${PAGE_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/docs/'
          git fetch --no-recurse-submodules --filter=blob:none --depth=1 origin "$PAGE_COMMIT"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD

      - name: Verify static entrypoint
        run: |
          test -s docs/index.html
          ls -lah docs/
          du -sh docs/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static project page
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: docs
          retention-days: 3

      - name: Verify artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..12}; do
            COUNT=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
              --jq '[.artifacts[] | select(.expired == false)] | length')
            echo "Available artifacts: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
