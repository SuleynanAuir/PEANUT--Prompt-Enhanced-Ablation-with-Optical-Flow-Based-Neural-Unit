name: Deploy PEANUT project page

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch project page at the triggering commit
        env:
          PAGE_REPOSITORY: ${{ github.repository }}
          PAGE_COMMIT: ${{ github.sha }}
        run: |
          git init
          git remote add origin "https://github.com/${PAGE_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/docs/'
          git fetch --no-recurse-submodules --filter=blob:none --depth=1 origin "$PAGE_COMMIT"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
      - name: Verify static entrypoint
        run: test -s docs/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static project page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
